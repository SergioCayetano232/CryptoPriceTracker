[project]
name = "crypto-price-tracker"
version = "0.1.0"
description = "Avisa por Telegram cuando una cripto cruza un precio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E,F: errores basicos. I: ordena imports. UP: sintaxis moderna.
# B: bugs sutiles (bugbear). SIM: simplificaciones.
select = ["E", "F", "I", "UP", "B", "SIM"]
# el if/else de _num se lee mejor que un ternario largo
ignore = ["SIM108"]

[tool.ruff.format]
quote-style = "double"
