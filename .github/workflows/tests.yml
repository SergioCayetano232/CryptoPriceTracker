name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La más vieja que admite pyproject.toml y la que uso yo
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Linter
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest
        env:
          # Sin pantalla en el servidor de GitHub
          MPLBACKEND: Agg
